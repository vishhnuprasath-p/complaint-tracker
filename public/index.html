<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Public Complaint Tracker</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: Arial, sans-serif; background: #f0f2f5; }
    header { background: #1a73e8; color: white; padding: 16px 32px; font-size: 22px; font-weight: bold; }
    .container { max-width: 900px; margin: 30px auto; padding: 0 16px; }
    .card { background: white; border-radius: 8px; padding: 24px; margin-bottom: 24px; box-shadow: 0 2px 6px rgba(0,0,0,0.1); }
    h2 { margin-bottom: 16px; color: #333; }
    input, textarea, select { width: 100%; padding: 10px; margin-bottom: 12px; border: 1px solid #ccc; border-radius: 6px; font-size: 14px; }
    button { background: #1a73e8; color: white; border: none; padding: 10px 20px; border-radius: 6px; cursor: pointer; font-size: 14px; }
    button:hover { background: #1558b0; }
    table { width: 100%; border-collapse: collapse; font-size: 14px; }
    th, td { padding: 10px 12px; border-bottom: 1px solid #eee; text-align: left; }
    th { background: #f5f5f5; font-weight: bold; }
    .badge { padding: 4px 10px; border-radius: 20px; font-size: 12px; font-weight: bold; }
    .Pending { background: #fff3cd; color: #856404; }
    .In.Progress { background: #cce5ff; color: #004085; }
    .Resolved { background: #d4edda; color: #155724; }
    select.status-select { width: auto; padding: 4px 8px; margin: 0; }
    .del-btn { background: #dc3545; padding: 4px 10px; font-size: 12px; }
    .del-btn:hover { background: #a71d2a; }
  </style>
</head>
<body>
  <header>📋 Public Complaint Tracking System</header>
  <div class="container">

    <!-- Submit Form -->
    <div class="card">
      <h2>Submit a Complaint</h2>
      <input id="name" placeholder="Your Name *" />
      <input id="email" placeholder="Your Email (optional)" />
      <select id="category">
        <option value="">-- Select Category *</option>
        <option>Roads & Infrastructure</option>
        <option>Water Supply</option>
        <option>Electricity</option>
        <option>Sanitation</option>
        <option>Public Safety</option>
        <option>Other</option>
      </select>
      <textarea id="description" rows="4" placeholder="Describe your complaint *"></textarea>
      <button onclick="submitComplaint()">Submit Complaint</button>
      <p id="msg" style="margin-top:10px;color:green;"></p>
    </div>

    <!-- Complaints Table -->
    <div class="card">
      <h2>All Complaints</h2>
      <table>
        <thead>
          <tr><th>ID</th><th>Name</th><th>Category</th><th>Description</th><th>Status</th><th>Date</th><th>Action</th></tr>
        </thead>
        <tbody id="complaintsTable"></tbody>
      </table>
    </div>
  </div>

  <script>
    async function loadComplaints() {
      const res = await fetch('/api/complaints');
      const data = await res.json();
      const tbody = document.getElementById('complaintsTable');
      tbody.innerHTML = data.map(c => `
        <tr>
          <td>${c.id}</td>
          <td>${c.name}</td>
          <td>${c.category}</td>
          <td>${c.description.substring(0, 60)}...</td>
          <td>
            <select class="status-select" onchange="updateStatus(${c.id}, this.value)">
              ${['Pending','In Progress','Resolved'].map(s =>
                `<option ${c.status===s?'selected':''}>${s}</option>`
              ).join('')}
            </select>
          </td>
          <td>${new Date(c.created_at).toLocaleDateString()}</td>
          <td><button class="del-btn" onclick="deleteComplaint(${c.id})">Delete</button></td>
        </tr>
      `).join('');
    }

    async function submitComplaint() {
      const body = {
        name: document.getElementById('name').value,
        email: document.getElementById('email').value,
        category: document.getElementById('category').value,
        description: document.getElementById('description').value
      };
      if (!body.name || !body.category || !body.description)
        return alert('Please fill in required fields!');
      const res = await fetch('/api/complaints', {
        method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify(body)
      });
      const data = await res.json();
      document.getElementById('msg').textContent = '✅ ' + data.message;
      ['name','email','description'].forEach(id => document.getElementById(id).value='');
      document.getElementById('category').value='';
      loadComplaints();
    }

    async function updateStatus(id, status) {
      await fetch(`/api/complaints/${id}/status`, {
        method: 'PATCH', headers: {'Content-Type':'application/json'}, body: JSON.stringify({status})
      });
      loadComplaints();
    }

    async function deleteComplaint(id) {
      if (!confirm('Delete this complaint?')) return;
      await fetch(`/api/complaints/${id}`, { method: 'DELETE' });
      loadComplaints();
    }

    loadComplaints();
  </script>
</body>
</html>
