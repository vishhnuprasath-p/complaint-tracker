<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Public Complaint Tracker</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">

<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  font-family: 'Poppins', sans-serif;
}

body {
  background: linear-gradient(135deg, #1e3c72, #2a5298);
  min-height: 100vh;
}

header {
  text-align: center;
  padding: 20px;
  font-size: 24px;
  color: white;
}

.container {
  max-width: 900px;
  margin: auto;
  padding: 20px;
}

.card {
  background: rgba(255,255,255,0.15);
  backdrop-filter: blur(10px);
  border-radius: 15px;
  padding: 25px;
  margin-bottom: 25px;
  box-shadow: 0 8px 20px rgba(0,0,0,0.2);
  color: white;
}

input, textarea, select {
  width: 100%;
  padding: 12px;
  margin-bottom: 12px;
  border-radius: 8px;
  border: none;
}

button {
  background: linear-gradient(to right, #0072ff, #00c6ff);
  color: white;
  border: none;
  padding: 12px;
  border-radius: 8px;
  cursor: pointer;
}

table {
  width: 100%;
  background: white;
  color: black;
  border-radius: 10px;
}

th {
  background: #0072ff;
  color: white;
}

td, th {
  padding: 10px;
}

.del-btn {
  background: red;
}
</style>
</head>

<body>

<header>🚀 Public Complaint Tracking System</header>

<div class="container">

<div class="card">
<h2>Submit Complaint</h2>
<input id="name" placeholder="Name">
<input id="email" placeholder="Email">
<select id="category">
<option>Electricity</option>
<option>Water</option>
</select>
<textarea id="description"></textarea>
<button onclick="submitComplaint()">Submit</button>
<p id="msg"></p>
</div>

<div class="card">
<h2>Complaints</h2>
<table>
<thead>
<tr>
<th>ID</th><th>Name</th><th>Category</th><th>Desc</th><th>Action</th>
</tr>
</thead>
<tbody id="complaintsTable"></tbody>
</table>
</div>

</div>

<script>

const BASE = "https://complaint-tracker-14fk.onrender.com";

async function loadComplaints(){
  const res = await fetch(BASE + "/api/complaints");
  const data = await res.json();

  document.getElementById("complaintsTable").innerHTML =
  data.map(c => `
    <tr>
      <td>${c.id}</td>
      <td>${c.name}</td>
      <td>${c.category}</td>
      <td>${c.description}</td>
      <td><button onclick="deleteComplaint(${c.id})">Delete</button></td>
    </tr>
  `).join("");
}

async function submitComplaint(){
  const body = {
    name: document.getElementById("name").value,
    email: document.getElementById("email").value,
    category: document.getElementById("category").value,
    description: document.getElementById("description").value
  };

  await fetch(BASE + "/api/complaints", {
    method: "POST",
    headers: {"Content-Type":"application/json"},
    body: JSON.stringify(body)
  });

  document.getElementById("msg").innerText = "Added ✅";

  loadComplaints();
}

async function deleteComplaint(id){
  await fetch(BASE + "/api/complaints/" + id, {method:"DELETE"});
  loadComplaints();
}

loadComplaints();

</script>

</body>
</html>
